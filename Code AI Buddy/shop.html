<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ice Cream Flavor Generator 🍦</title>
    <style>
        body {
            font-family: 'Comic Neue', cursive;
            background: linear-gradient(135deg, #ffe6f2, #ccf2ff);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }

        h1 {
            color: #ff69b4;
            text-align: center;
            font-size: 2.5em;
            margin-bottom: 30px;
        }

        .question-group {
            margin-bottom: 25px;
            padding: 15px;
            background: #fff5f8;
            border-radius: 10px;
        }

        button {
            background: #ff69b4;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1.1em;
            transition: transform 0.2s;
            display: block;
            margin: 20px auto;
        }

        button:hover {
            transform: scale(1.05);
            background: #ff1493;
        }

        #result {
            display: none;
            text-align: center;
            font-size: 1.5em;
            padding: 20px;
            margin-top: 30px;
            background: #fff0f5;
            border-radius: 10px;
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .flavor-name {
            color: #ff69b4;
            font-weight: bold;
            font-size: 1.8em;
            text-transform: uppercase;
            margin: 15px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Create Your Dream Ice Cream! 🍨</h1>
        
        <form id="iceCreamForm">
            <div class="question-group">
                <h3>1. Your favorite base flavor?</h3>
                <label><input type="radio" name="base" value="vanilla" required> Classic Vanilla</label><br>
                <label><input type="radio" name="base" value="chocolate"> Rich Chocolate</label><br>
                <label><input type="radio" name="base" value="strawberry"> Fresh Strawberry</label>
            </div>

            <div class="question-group">
                <h3>2. What texture do you prefer?</h3>
                <label><input type="radio" name="texture" value="creamy" required> Super Creamy</label><br>
                <label><input type="radio" name="texture" value="airy"> Light & Airy</label><br>
                <label><input type="radio" name="texture" value="chewy"> Chewy & Thick</label>
            </div>

            <div class="question-group">
                <h3>3. Pick a wildcard ingredient!</h3>
                <label><input type="radio" name="mixIn" value="caramel-swirl" required> Caramel Swirl</label><br>
                <label><input type="radio" name="mixIn" value="cookie-dough"> Cookie Dough</label><br>
                <label><input type="radio" name="mixIn" value="fruit-explosion"> Fruit Explosion</label>
            </div>

            <button type="button" onclick="generateFlavor()">Create My Flavor! 🎉</button>
        </form>

        <div id="result">
            <div class="flavor-name" id="flavorDisplay"></div>
            <p id="flavorDescription"></p>
            <p>Enjoy your imaginary treat! 😋</p>
        </div>
    </div>

    <script>
        const flavorComponents = {
            bases: {
                vanilla: ["Vanilla Dream", "French Vanilla", "Madagascar Vanilla"],
                chocolate: ["Chocolate Obsession", "Decadent Cocoa", "Fudge Wave"],
                strawberry: ["Strawberry Fields", "Berry Blast", "Pink Paradise"]
            },
            textures: {
                creamy: ["Ultra-Creamy", "Silky Smooth", "Velvety"],
                airy: ["Cloud-Like", "Whipped Wonder", "Marshmallow Fluff"],
                chewy: ["Chewy Delight", "Stretchy Sensation", "Mochi Magic"]
            },
            mixIns: {
                "caramel-swirl": ["with Salted Caramel Swirls", "drizzled with Golden Caramel", "& Caramel Ribbons"],
                "cookie-dough": ["with Cookie Dough Chunks", "stuffed with Edible Cookie Dough", "& Doughy Surprises"],
                "fruit-explosion": ["with Fresh Fruit Chunks", "bursting with Berry Medley", "& Tropical Fruit Swirls"]
            },
            adjectives: ["Magical", "Enchanted", "Mystical", "Sparkling", "Moonlit"]
        };

        function generateFlavor() {
            const form = document.forms['iceCreamForm'];
            if (!form.checkValidity()) {
                alert("Please answer all questions first! ❤️");
                return;
            }

            const base = form.base.value;
            const texture = form.texture.value;
            const mixIn = form.mixIn.value;

            const randomAdjective = flavorComponents.adjectives[Math.floor(Math.random() * flavorComponents.adjectives.length)];
            const baseName = flavorComponents.bases[base][Math.floor(Math.random() * 3)];
            const textureDesc = flavorComponents.textures[texture][Math.floor(Math.random() * 3)];
            const mixInDesc = flavorComponents.mixIns[mixIn][Math.floor(Math.random() * 3)];

            const flavorName = `${randomAdjective} ${baseName}`;
            const flavorText = `${textureDesc} ${mixInDesc}`;

            document.getElementById('flavorDisplay').textContent = flavorName;
            document.getElementById('flavorDescription').textContent = flavorText;
            document.getElementById('result').style.display = 'block';
        }
    </script>
</body>
</html>
